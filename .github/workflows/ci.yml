name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend (test with real MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: barber_booking_test
          MYSQL_USER: barber_booking
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot_secret --silent && break
            sleep 2
          done

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: barber_booking_test
          DB_USERNAME: barber_booking
          DB_PASSWORD: secret
        run: php artisan migrate --no-interaction

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: barber_booking_test
          DB_USERNAME: barber_booking
          DB_PASSWORD: secret
        run: php artisan test --compact

  docker-build:
    name: Docker images build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend and frontend images
        run: docker compose build backend frontend

  production:
    name: Production stack (build + migrate + smoke test)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prodci
    steps:
      - uses: actions/checkout@v4

      # Random throwaway secrets for this run only, plain HTTP with the
      # explicit ALLOW_INSECURE_HTTP=true (docker/production/local-env.sh).
      - name: Create a CI-only environment file
        run: sh docker/production/local-env.sh .env.prodci 8080 barber-booking-prodci

      - name: Validate the Compose file
        run: |
          $COMPOSE config --quiet
          services="$($COMPOSE config --services | sort | paste -sd ' ')"
          echo "services: $services"
          test "$services" = "backend mysql scheduler web"
          # No Mailpit and no Node/Vite image; the smoke test also checks
          # that the HTML served is the production build.
          $COMPOSE config --images
          if $COMPOSE config --images | grep -qiE 'mailpit|node'; then
            echo "The production stack must not use Mailpit or the Vite dev server." >&2
            exit 1
          fi

      - name: Build production images
        run: $COMPOSE build --pull

      - name: The image refuses APP_DEBUG=true
        run: |
          if $COMPOSE run --rm --no-deps -e APP_DEBUG=true backend php -v; then
            echo "The backend started with APP_DEBUG=true." >&2
            exit 1
          fi

      - name: Start the database
        run: $COMPOSE up -d --wait --wait-timeout 180 mysql

      - name: Migrate a new database and create the business settings row
        run: |
          $COMPOSE run --rm backend php artisan migrate --force --no-interaction
          $COMPOSE run --rm backend php artisan db:seed --force --no-interaction

      - name: Start the stack
        run: $COMPOSE up -d --wait --wait-timeout 180

      - name: Debug mode is off and the scheduler runs
        run: |
          $COMPOSE exec -T backend php artisan config:show app.debug | grep -q false
          $COMPOSE exec -T scheduler pgrep -f '^php artisan schedule:work'
          $COMPOSE exec -T scheduler php artisan schedule:list

      - name: Smoke test
        run: sh docker/production/smoke-test.sh http://127.0.0.1:8080

      - name: The smoke test fails without the backend
        run: |
          $COMPOSE stop backend
          if sh docker/production/smoke-test.sh http://127.0.0.1:8080; then
            echo "The smoke test passed with the backend down." >&2
            exit 1
          fi
          $COMPOSE start backend

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail=100

      - name: Remove the CI stack
        if: always()
        run: $COMPOSE down -v --remove-orphans
