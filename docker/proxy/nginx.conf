# Access-log format for the signed cancellation links: $uri is the path only,
# so the `signature`/`expires` query string never reaches the log
# (docs/planejamento-barbearia-mvp.md, seção 2). This file is mounted as
# conf.d/default.conf, i.e. inside nginx's http context.
log_format no_query '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;

    # Laravel's built-in health endpoint and the API share the backend.
    location /up {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Sanctum's CSRF cookie route, registered by the framework outside /api.
    location /sanctum/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer cancellation pages (signed links sent by e-mail): a Laravel page
    # outside /api, served by the backend, not the SPA.
    location /cancelar/ {
        access_log /var/log/nginx/access.log no_query;
        proxy_pass http://backend:8000;
        # $http_host keeps the public port (localhost:8080): Laravel builds
        # the absolute redirect after a cancellation from it. ($host would
        # drop the port and send the browser to http://localhost/...)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Vite dev server, including the HMR
    # websocket upgrade, so frontend and API are served from one origin.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
