; PHP-FPM pool overrides for production (loaded after the image's
; docker.conf/zz-docker.conf, which already keep the container environment
; and send worker output to stderr).
[www]
; nginx logs every request (without the query string of the signed
; cancellation links); a second access log here would only add noise.
access.log = /dev/null

; Answered by FPM itself, without PHP: used by the container healthcheck
; (cgi-fcgi) and never reachable from outside (nginx only forwards /api,
; /sanctum, /cancelar and /up, always to public/index.php).
ping.path = /fpm-ping
ping.response = pong

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
