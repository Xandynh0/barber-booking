; Production overrides on top of php.ini-production
; (docker/production/backend.Dockerfile).

; Stack traces in the container log never carry argument values, so customer
; e-mails and phone numbers passed to booking methods cannot end up there.
zend.exception_ignore_args = On
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
post_max_size = 1M
upload_max_filesize = 1M

; The code never changes inside a running container: no timestamp checks.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
