name: barber-booking

services:
  mysql:
    image: mysql:8.4
    container_name: barber-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-barber_booking}
      MYSQL_USER: ${MYSQL_USER:-barber_booking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: barber-booking-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: barber-booking-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment: &backend-environment
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-barber_booking}
      DB_USERNAME: ${MYSQL_USER:-barber_booking}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Laravel scheduler: runs the recovery sweep for confirmation e-mails
  # (routes/console.php) every minute. Same image, code and environment as
  # the backend. One container only: the fixed container_name makes Compose
  # reuse it on every `up`/restart (and refuse --scale), and the task itself
  # is withoutOverlapping + onOneServer.
  scheduler:
    build:
      context: ./backend
    container_name: barber-booking-scheduler
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker compose stop` ends
    # schedule:work promptly instead of waiting for the kill timeout.
    init: true
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ./backend/.env
    environment: *backend-environment
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Anchored on the PHP process itself (PID 1 is tini, whose command line
      # also contains "schedule:work").
      test: ["CMD", "pgrep", "-f", "^php artisan schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: barber-booking-frontend
    restart: unless-stopped
    environment:
      VITE_DEV_SERVER_PROXIED: "true"
      APP_PORT: ${APP_PORT:-8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    image: nginx:1.27-alpine
    container_name: barber-booking-proxy
    restart: unless-stopped
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  mysql_data:
  frontend_node_modules:
